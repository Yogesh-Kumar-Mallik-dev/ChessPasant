name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ============================================================================
  # 1. Backend Verification (Go)
  # ============================================================================
  backend-ci:
    name: Backend CI (Go Test & Vet)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: apps/server/go.sum

      - name: Download Go modules
        run: cd apps/server && go mod download

      - name: Go Vet
        run: cd apps/server && go vet ./...

      - name: Run Backend Tests
        run: cd apps/server && go test -v ./...

  # ============================================================================
  # 2. Web Verification & Build (SvelteKit)
  # ============================================================================
  web-ci:
    name: Web CI (Check, Test & Build)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Web Dependencies
        run: npm --prefix apps/web ci

      - name: Run Svelte Diagnostics (Typecheck)
        run: npm --prefix apps/web run check

      - name: Run Web Unit Tests (Vitest)
        run: npm --prefix apps/web run test

      - name: Build Web Production Assets
        run: npm --prefix apps/web run build

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: apps/web/build/
          retention-days: 7

  # ============================================================================
  # 4. Continuous Deployment to Production VPS
  # ============================================================================
  deploy-production:
    name: Deploy to Production VPS
    needs: [backend-ci, web-ci]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    environment:
      name: production
      url: https://chess.yogeshmallik.in

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go for Compilation
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: apps/server/go.sum

      - name: Compile Backend Server Binary (Linux AMD64)
        run: |
          cd apps/server
          mkdir -p bin
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o bin/server cmd/server/main.go
          ls -lh bin/server

      - name: Download Web Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: apps/web/build

      - name: Setup SSH Deploy Key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_HOST: ${{ secrets.VPS_HOST || '162.35.173.209' }}
          SSH_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::error::Secret VPS_SSH_KEY is not configured! Please configure VPS_SSH_KEY in Repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Strip per-line indentation (e.g. YAML 4-space indent) and normalize line endings
          python3 -c "
          import sys, os
          raw = sys.stdin.read().strip()
          raw = raw.replace('\r', '')
          if '\\n' in raw and '\n' not in raw:
              raw = raw.replace('\\n', '\n')
          lines = [line.strip() for line in raw.splitlines() if line.strip()]
          raw = '\n'.join(lines) + '\n'
          with open(os.path.expanduser('~/.ssh/id_ed25519'), 'w') as f:
              f.write(raw)
          " <<< "$SSH_PRIVATE_KEY"

          chmod 600 ~/.ssh/id_ed25519
          echo "SSH key loaded and verified:"
          ssh-keygen -lf ~/.ssh/id_ed25519

      - name: Verify SSH Connection to VPS
        env:
          SSH_HOST: ${{ secrets.VPS_HOST || '162.35.173.209' }}
          SSH_USER: ${{ secrets.VPS_USER || 'root' }}
          SSH_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          echo "Testing SSH connectivity to ${SSH_USER}@${SSH_HOST}..."
          SSH_OUT=$(ssh -v -p "$SSH_PORT" -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o BatchMode=yes \
            "${SSH_USER}@${SSH_HOST}" "echo 'SSH CONNECTION VERIFIED' && whoami && uptime" 2>&1 || true)
          echo "$SSH_OUT"
          echo "::error file=.github,line=3,title=SSHDebug::$(echo "$SSH_OUT" | tail -n 10 | tr '\n' ' | ')"
          if ! echo "$SSH_OUT" | grep -q "SSH CONNECTION VERIFIED"; then
            echo "::error::SSH connection test failed!"
            exit 1
          fi

      - name: Deploy Frontend Web Assets via Rsync
        env:
          SSH_HOST: ${{ secrets.VPS_HOST || '162.35.173.209' }}
          SSH_USER: ${{ secrets.VPS_USER || 'root' }}
          SSH_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          echo "Deploying frontend assets to /var/www/chessnova/html/..."
          rsync -avz --delete \
            --exclude 'repo/' \
            -e "ssh -p $SSH_PORT -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            apps/web/build/ \
            "${SSH_USER}@${SSH_HOST}:/var/www/chessnova/html/"
          ssh -p "$SSH_PORT" -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "${SSH_USER}@${SSH_HOST}" 'chown -R www-data:www-data /var/www/chessnova/html 2>/dev/null || true'

      - name: Deploy Backend Binary & Restart Service
        env:
          SSH_HOST: ${{ secrets.VPS_HOST || '162.35.173.209' }}
          SSH_USER: ${{ secrets.VPS_USER || 'root' }}
          SSH_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          echo "Uploading backend binary..."
          rsync -avz \
            -e "ssh -p $SSH_PORT -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            apps/server/bin/server \
            "${SSH_USER}@${SSH_HOST}:/opt/chessnova/bin/server.new"

          echo "Applying binary and restarting chessnova services..."
          ssh -p "$SSH_PORT" -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "${SSH_USER}@${SSH_HOST}" '
            mv /opt/chessnova/bin/server.new /opt/chessnova/bin/server
            chmod +x /opt/chessnova/bin/server
            chown -R yogesh:yogesh /opt/chessnova/bin 2>/dev/null || true
            systemctl restart chessnova@8081 chessnova@8082 chessnova@8083 2>/dev/null || systemctl restart chessnova
            (systemctl is-active --quiet chessnova@8081 || systemctl is-active --quiet chessnova) && echo "chessnova backend restarted successfully."
          '

      - name: Post-Deployment Health Check
        run: |
          echo "Verifying production deployment health..."
          HEALTH_URL="https://chess.yogeshmallik.in/health"
          MAX_RETRIES=10
          RETRY_INTERVAL=3

          for ((i=1; i<=MAX_RETRIES; i++)); do
            RESPONSE=$(curl -s -f "$HEALTH_URL" || echo "")
            if echo "$RESPONSE" | grep -q "ok"; then
              echo "Health check succeeded: $RESPONSE"
              exit 0
            fi
            echo "Health check attempt $i/$MAX_RETRIES failed. Retrying in ${RETRY_INTERVAL}s..."
            sleep "$RETRY_INTERVAL"
          done

          echo "::error::Production health check failed after $MAX_RETRIES attempts!"
          exit 1
