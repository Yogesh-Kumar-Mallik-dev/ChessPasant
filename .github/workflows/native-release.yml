name: Native Multiplatform Release (Linux, Android, Windows, macOS, iOS)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach binaries to (e.g. v0.1.8)'
        required: true
        type: string
        default: 'v0.1.8'
      release_draft:
        description: 'Publish as Draft Release'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # ============================================================================
  # 1. Linux Native Binary (ELF 64-bit + Arch Linux PKG)
  # ============================================================================
  build-linux:
    name: Build Linux Native (x64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Linux Build Dependencies
        run: |
          sudo add-apt-repository universe -y || true
          sudo apt-get update -y
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            zstd
          sudo apt-get install -y libunwind-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev || true

      - name: Build Flutter Linux Release
        working-directory: apps/app
        run: |
          flutter pub get
          flutter build linux --release

      - name: Package Linux Standalone Bundle & Arch Package
        run: |
          RAW_TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${RAW_TAG#v}"
          VERSION="${VERSION:-0.1.8}"
          mkdir -p dist/linux dist/arch

          echo "==> Creating standalone Linux tarball..."
          tar -czvf "dist/linux/ChessPasant_${VERSION}_linux_x64.tar.gz" -C apps/app/build/linux/x64/release/bundle .

          echo "==> Packaging Arch Linux .pkg.tar.zst..."
          chmod +x ./packaging/arch/package-arch.sh
          ./packaging/arch/package-arch.sh "$VERSION" "$GITHUB_WORKSPACE/dist/arch"

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chesspasant-linux-bundles
          path: |
            dist/linux/*.tar.gz
            dist/arch/*.pkg.tar.zst
            dist/arch/*.tar.gz

  # ============================================================================
  # 2. Android APK & Google Play App Bundle (AAB)
  # ============================================================================
  build-android:
    name: Build Android (APK & AAB)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configure Android SDK in Flutter
        run: |
          echo "y" | flutter config --android-sdk "$ANDROID_HOME"
          yes | flutter doctor --android-licenses || true
          flutter doctor -v

      - name: Build Android Release Binaries
        working-directory: apps/app
        run: |
          flutter pub get
          flutter build apk --release --verbose
          flutter build appbundle --release --verbose

      - name: Prepare Android Artifacts
        run: |
          RAW_TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${RAW_TAG#v}"
          VERSION="${VERSION:-0.1.8}"
          mkdir -p dist/android

          cp apps/app/build/app/outputs/flutter-apk/app-release.apk "dist/android/ChessPasant_${VERSION}.apk"
          cp apps/app/build/app/outputs/bundle/release/app-release.aab "dist/android/ChessPasant_${VERSION}.aab"

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chesspasant-android-bundles
          path: dist/android/*

  # ============================================================================
  # 3. Windows Native Executable & Portable Bundle
  # ============================================================================
  build-windows:
    name: Build Windows Native (x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build Windows Release
        working-directory: apps/app
        run: |
          flutter pub get
          flutter build windows --release

      - name: Package Windows ZIP Bundle
        shell: bash
        run: |
          RAW_TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${RAW_TAG#v}"
          VERSION="${VERSION:-0.1.8}"
          mkdir -p dist/windows

          cd apps/app/build/windows/x64/runner/Release
          7z a -tzip "$GITHUB_WORKSPACE/dist/windows/ChessPasant_${VERSION}_windows_x64.zip" *

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chesspasant-windows-bundles
          path: dist/windows/*

  # ============================================================================
  # 4. Apple macOS & iOS Native Builds
  # ============================================================================
  build-apple:
    name: Build macOS & iOS Native
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build macOS Release
        working-directory: apps/app
        run: |
          flutter pub get
          flutter build macos --release

      - name: Package macOS Application
        run: |
          RAW_TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${RAW_TAG#v}"
          VERSION="${VERSION:-0.1.8}"
          mkdir -p dist/macos

          ditto -c -k --sequesterRsrc --keepParent \
            apps/app/build/macos/Build/Products/Release/ChessPasant.app \
            "dist/macos/ChessPasant_${VERSION}_macos.zip"

      - name: Build iOS Release (Unsigned IPA)
        working-directory: apps/app
        run: |
          flutter build ios --release --no-codesign

      - name: Package iOS IPA
        run: |
          RAW_TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${RAW_TAG#v}"
          VERSION="${VERSION:-0.1.8}"
          mkdir -p dist/ios /tmp/Payload

          cp -r apps/app/build/ios/iphoneos/Runner.app /tmp/Payload/
          (cd /tmp && zip -r "$GITHUB_WORKSPACE/dist/ios/ChessPasant_${VERSION}_ios_unsigned.ipa" Payload)

      - name: Upload Apple Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chesspasant-apple-bundles
          path: |
            dist/macos/*
            dist/ios/*

  # ============================================================================
  # 5. Aggregate & Publish to GitHub Releases
  # ============================================================================
  publish-release:
    name: Publish Release Assets
    needs: [build-linux, build-android, build-windows, build-apple]
    runs-on: ubuntu-latest
    if: always() && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: release-assets/
          merge-multiple: true

      - name: Flatten Release Assets
        run: |
          mkdir -p final-assets
          find release-assets/ -type f -exec cp {} final-assets/ \;
          echo "==> Gathered release assets:"
          ls -lh final-assets/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: 'ChessPasant ${{ github.event.inputs.tag || github.ref_name }} (True Native Release)'
          draft: ${{ github.event.inputs.release_draft == 'true' || false }}
          prerelease: false
          body_path: .github/release-notes.md
          files: final-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
