name: chesspasant
description: "ChessPasant - Authentic Acoustic Chess Platform (True Native Multiplatform)"
publish_to: "none"
version: 0.1.7+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  chess: ^0.8.1
  flutter_svg: ^2.0.10+1
  audioplayers: ^6.1.0
  web_socket_channel: ^3.0.1
  dio: ^5.7.0
  shared_preferences: ^2.3.3
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/
    - assets/pieces/
